<html>

<head>
    <title>JavaScript Number Checker</title>
    <style>
        body {
            font-family: 'sans-serif';
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: lightgray;
            padding: 2.5;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;

            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #222;
        }

        button {
            background-color: #2b2d42;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }

        #output {
            margin-top: 25px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            font-weight: 500;
            min-height: 24px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Odd Even Tester</h2>
        <p>Click the button below to run the current script.</p>

        <button onclick="runTask()">Run Program</button>

        <div id="output">Result will appear here...</div>
    </div>

    <script>
        function runTask() {
            let num = parseInt(prompt("Enter a number:"));
            let result = (num % 2 === 0) ? "Even" : "Odd";
            document.getElementById("output").innerHTML = `The number ${num} is <strong>${result}</strong>.`;
        }

    </script>
</body>

</html>
